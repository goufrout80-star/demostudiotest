name: Build AuraX Game Lab

on:
  push:
    branches:
      - aurax-game-lab-beta
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish standalone Windows x64
        shell: pwsh
        run: dotnet publish aurax-game-lab/AuraXGameLab.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o output

      - name: Copy notice
        shell: pwsh
        run: Copy-Item aurax-game-lab/README.md output/README.txt

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AuraX-Game-Lab-Beta-0.2-Standalone-Windows-x64
          path: output/
          if-no-files-found: error
